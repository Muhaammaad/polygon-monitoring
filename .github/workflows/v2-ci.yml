name: V2 CI

on:
  push:
  pull_request:

jobs:
  v2-ci:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: onduty_bi
          MYSQL_USER: onduty
          MYSQL_PASSWORD: changeme
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u$MYSQL_USER -p$MYSQL_PASSWORD"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: onduty
      DB_PASSWORD: changeme
      DB_NAME: onduty_bi
      TELEGRAM_BOT_TOKEN: dummy
      TWILIO_ACCOUNT_SID: dummy
      TWILIO_AUTH_TOKEN: dummy
      TWILIO_FROM_NUMBER: +41000000000
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      APP_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for MySQL
        run: |
          python - <<'PY'
          import os
          import sys
          import time

          import pymysql

          host = os.environ["DB_HOST"]
          user = os.environ["DB_USER"]
          password = os.environ["DB_PASSWORD"]
          database = os.environ["DB_NAME"]
          port = int(os.environ.get("DB_PORT", "3306"))

          for _ in range(30):
              try:
                  conn = pymysql.connect(
                      host=host,
                      port=port,
                      user=user,
                      password=password,
                      database=database,
                  )
                  conn.close()
                  print("MySQL is ready")
                  sys.exit(0)
              except Exception as exc:
                  print(f"Waiting for MySQL: {exc}")
                  time.sleep(2)

          print("MySQL did not become ready in time")
          sys.exit(1)
          PY

      - name: Validate city configs
        run: python cli/main.py config validate

      - name: Validate polygons
        run: python cli/main.py polygons validate

      - name: Run pytest
        run: pytest tests/ -v
